services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: rag_security
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run scripts/init_env.py first}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/01-bootstrap.sh:/docker-entrypoint-initdb.d/01-bootstrap.sh:ro
      - ./db/schema.sql:/opt/rag/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_security"]
      interval: 3s
      timeout: 3s
      retries: 25
    security_opt:
      - no-new-privileges:true
  api:
    build:
      context: .
      target: test
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      AUTH_MODE: ${AUTH_MODE:-local}
      AUTH_ISSUER: ${AUTH_ISSUER:-secure-rag-local}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-secure-rag-api}
      LOCAL_JWT_SECRET: ${LOCAL_JWT_SECRET:?Run scripts/init_env.py first}
      DATABASE_URL: ${DATABASE_URL:?Run scripts/init_env.py first}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hash}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-all-minilm}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  db_data:
